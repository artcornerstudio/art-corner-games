name: Sound audition (early results)

# Temporary. Commits the finished parts of a Sound audition run (Kokoro,
# Chatterbox, sounds) without waiting for its slowest job. Delete with audition/.
on:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/audition-early.yml"]

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "37951367991"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, run-id: "${{ env.RUN_ID }}", github-token: "${{ github.token }}" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make small loudness-matched mp3s and commit
        run: |
          set -u
          mkdir -p audition/out/voices audition/out/sounds
          for eng in kokoro chatterbox qwen; do
            d="dl/voices-$eng"; [ -d "$d" ] || continue
            cp "$d/results.json" "audition/out/voices/$eng.json" 2>/dev/null || true
            for v in "$d"/*/; do
              key=$(basename "$v"); mkdir -p "audition/out/voices/$key"
              for w in "$v"*.wav; do
                ffmpeg -y -loglevel error -i "$w" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ac 1 -ar 24000 -b:a 64k \
                  "audition/out/voices/$key/$(basename "${w%.wav}").mp3"
              done
            done
            [ -f "$d/ref-eric.wav" ] && ffmpeg -y -loglevel error -i "$d/ref-eric.wav" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ac 1 -b:a 64k audition/out/voices/ref-eric.mp3
          done
          [ -d dl/sounds ] && cp dl/sounds/* audition/out/sounds/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A audition/out
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Sound audition results (early)"
          git pull --rebase -q || true
          git push
