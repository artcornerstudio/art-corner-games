name: Deploy to GitHub Pages

# Publishes the shared games site from main: the Football IQ app at the
# site root, and Spread Out! (a static folder, no build step) at
# /spread-out/. Enable Pages with source "GitHub Actions" in the
# repository settings for this to go live.
on:
  push:
    branches: [main]
    paths: ["football-iq/**", "spread-out/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football-iq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: football-iq/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Add Spread Out! (static, served at /spread-out/)
        run: |
          mkdir -p dist/spread-out
          cp -R ../spread-out/. dist/spread-out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: football-iq/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
