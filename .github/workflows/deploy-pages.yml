name: Deploy to GitHub Pages

# Publishes the shared games site from main: the Football IQ app at the
# site root, and a Spread Out! landing page at /spread-out/ that points to
# the game at play.artcornerstudio.cloud. Enable Pages with source "GitHub Actions" in the
# repository settings for this to go live.
on:
  push:
    branches: [main]
    paths: ["football-iq/**", "spread-out/**", "spread-out-pages/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football-iq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: football-iq/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Add the Spread Out! landing page (served at /spread-out/)
        # The game itself is sold and played at play.artcornerstudio.cloud
        # (spread-out-server/). This address only shows a page pointing there,
        # plus the privacy page and icons. sw.js retires old offline copies.
        run: |
          mkdir -p dist/spread-out
          cp -R ../spread-out/icons dist/spread-out/icons
          cp ../spread-out/privacy.html dist/spread-out/privacy.html
          cp ../spread-out-pages/index.html ../spread-out-pages/sw.js dist/spread-out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: football-iq/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
