name: Deploy to GitHub Pages

# Publishes the shared games site from main: a Football IQ landing page at the
# site root and a Spread Out! landing page at /spread-out/. Both point to the games,
# which are sold and played at play.artcornerstudio.cloud (the free full copy of
# Football IQ that used to live here is gone; the landing page's sw.js clears it from
# devices that saved it). Enable Pages with source "GitHub Actions" in the
# repository settings for this to go live.
on:
  push:
    branches: [main]
    paths: ["football-iq/**", "football-iq-pages/**", "spread-out/**", "spread-out-pages/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football-iq
    steps:
      - uses: actions/checkout@v4
      - name: Football IQ landing page (the game itself is at play.artcornerstudio.cloud/football-iq/)
        # dist is just a folder to assemble the site in; nothing is built or bundled.
        run: |
          mkdir -p dist/art dist/icons dist/spread-out
          cp ../football-iq-pages/index.html ../football-iq-pages/sw.js public/privacy.html public/favicon.svg dist/
          cp public/art/mascot.png dist/art/
          cp public/icons/icon-192.png dist/icons/
      - name: Add the Spread Out! landing page (served at /spread-out/)
        # The game itself is sold and played at play.artcornerstudio.cloud
        # (spread-out-server/). This address only shows a page pointing there,
        # plus the privacy page and icons. sw.js retires old offline copies.
        run: |
          mkdir -p dist/spread-out
          cp -R ../spread-out/icons dist/spread-out/icons
          cp ../spread-out/privacy.html dist/spread-out/privacy.html
          cp ../spread-out-pages/index.html ../spread-out-pages/sw.js dist/spread-out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: football-iq/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
