name: Sound audition

# Temporary. Records the same Spread Out! coach lines in several free voice
# engines and fetches candidate sound effects (Creative Commons 0 only), then
# commits everything to audition/out/ on the same branch so it can be listened
# to and compared. Delete this workflow and audition/ once choices are made.
on:
  push:
    branches-ignore: [main]
    paths: ["audition/voices.py", "audition/sounds.txt", ".github/workflows/sound-audition.yml"]

permissions:
  contents: write

concurrency:
  group: sound-audition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile numpy
      - run: python audition/voices.py kokoro --out out/kokoro
      - uses: actions/upload-artifact@v4
        with: { name: voices-kokoro, path: out/kokoro }

  chatterbox:
    needs: kokoro
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: voices-kokoro, path: ref }
      - run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts soundfile
      - run: python audition/voices.py chatterbox --out out/chatterbox --ref ref/ref-eric.wav
      - uses: actions/upload-artifact@v4
        with: { name: voices-chatterbox, path: out/chatterbox }

  qwen:
    needs: kokoro
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: voices-kokoro, path: ref }
      - run: sudo apt-get update && sudo apt-get install -y sox libsox-dev
      - run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -U qwen-tts soundfile
      - run: python audition/voices.py qwen --out out/qwen --ref ref/ref-eric.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: voices-qwen, path: out/qwen, if-no-files-found: ignore }

  sounds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Creative Commons 0 previews from Freesound
        run: |
          set -u
          mkdir -p out/sounds
          echo '[' > out/sounds/sounds.json; first=1
          while read -r name id; do
            case "$name" in ''|'#'*) continue ;; esac
            page=$(curl -fsSL --max-time 30 -A "Mozilla/5.0" "https://freesound.org/s/$id/" || true)
            if ! printf '%s' "$page" | grep -q 'publicdomain/zero/1.0'; then echo "SKIP $name ($id): not CC0 or page unavailable"; continue; fi
            url=$(printf '%s' "$page" | grep -o 'https://cdn.freesound.org/previews/[^"]*-hq\.mp3' | head -1)
            [ -n "$url" ] || url=$(printf '%s' "$page" | grep -o 'https://cdn.freesound.org/previews/[^"]*\.mp3' | head -1)
            [ -n "$url" ] || { echo "SKIP $name ($id): no preview found"; continue; }
            curl -fsSL --max-time 60 -o "out/sounds/$name.mp3" "$url" || { echo "SKIP $name: download failed"; continue; }
            title=$(printf '%s' "$page" | grep -o '<meta property="og:title" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"$//' | sed 's/\\/\\\\/g;s/"/\\"/g')
            [ $first = 1 ] || echo ',' >> out/sounds/sounds.json; first=0
            printf '{"name":"%s","id":%s,"title":"%s","page":"https://freesound.org/s/%s/","license":"CC0"}\n' "$name" "$id" "$title" "$id" >> out/sounds/sounds.json
            echo "OK   $name ($id) $title"
          done < audition/sounds.txt
          echo ']' >> out/sounds/sounds.json
          cat out/sounds/sounds.json
      - uses: actions/upload-artifact@v4
        with: { name: sounds, path: out/sounds }

  collect:
    needs: [kokoro, chatterbox, qwen, sounds]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make small loudness-matched mp3s and commit
        run: |
          set -u
          rm -rf audition/out && mkdir -p audition/out/voices audition/out/sounds
          for eng in kokoro chatterbox qwen; do
            d="dl/voices-$eng"; [ -d "$d" ] || continue
            cp "$d/results.json" "audition/out/voices/$eng.json" 2>/dev/null || true
            for v in "$d"/*/; do
              key=$(basename "$v"); mkdir -p "audition/out/voices/$key"
              for w in "$v"*.wav; do
                ffmpeg -y -loglevel error -i "$w" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ac 1 -ar 24000 -b:a 64k \
                  "audition/out/voices/$key/$(basename "${w%.wav}").mp3"
              done
            done
            [ -f "$d/ref-eric.wav" ] && ffmpeg -y -loglevel error -i "$d/ref-eric.wav" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ac 1 -b:a 64k audition/out/voices/ref-eric.mp3
          done
          [ -d dl/sounds ] && cp dl/sounds/* audition/out/sounds/ || true
          echo "jobs: kokoro=${{ needs.kokoro.result }} chatterbox=${{ needs.chatterbox.result }} qwen=${{ needs.qwen.result }} sounds=${{ needs.sounds.result }}" > audition/out/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A audition/out
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Sound audition results"
          git pull --rebase -q || true
          git push
