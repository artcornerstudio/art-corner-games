name: Spread Out voice clips

# Records every fixed sentence in Spread Out! with Coach Eric's voice (Kokoro,
# "am_eric", the same voice as Football IQ) and commits the clips to the branch
# the workflow was started from.
#
# Run it by hand: Actions tab, "Spread Out voice clips", "Run workflow", and
# pick the branch that holds the new lines. It refuses to run on main, so the
# clips always arrive through a normal pull request.
#
# Safe to run again: clips already in the repository are skipped, so only new
# or edited sentences are recorded.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spread-out-voice-clips
  cancel-in-progress: false

jobs:
  record:
    if: ${{ github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg

      - name: Install Kokoro (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile numpy

      - name: Record this slice
        run: |
          python football-iq/voice/render_clips.py \
            --units spread-out/voice/units.json \
            --out new-clips \
            --skip-dir spread-out/voice \
            --shard ${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v4
        with:
          name: spread-out-clips-${{ matrix.shard }}
          path: new-clips
          if-no-files-found: ignore

  publish:
    needs: record
    if: ${{ !cancelled() && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the clips to the branch this run started from
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: spread-out-clips-*
          merge-multiple: true
          path: spread-out/voice

      - name: Write the clip list
        run: |
          rm -f spread-out/voice/failed-shard-*.json
          python3 football-iq/voice/render_clips.py \
            --units spread-out/voice/units.json \
            --out spread-out/voice --manifest-only

      - name: Commit the clips to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spread-out/voice
          if git diff --cached --quiet; then
            echo "No new clips to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Record Coach Eric voice clips for Spread Out! (am_eric)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          {
            echo "### Spread Out voice clips"
            echo
            echo "New clips were committed to the **${{ github.ref_name }}** branch. Open or update a pull request from it into main to publish them."
          } >> "$GITHUB_STEP_SUMMARY"
