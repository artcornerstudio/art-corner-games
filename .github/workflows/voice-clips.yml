name: Voice clips

# Records every fixed sentence of a game with the coach voice (Kokoro,
# "am_eric", Coach Eric in both games).
#
# Run it by hand: Actions tab, "Voice clips", "Run workflow", pick the branch
# and the game.
#   * Football IQ (the default): the clips go on a branch called voice-clips.
#     It never touches main and never deploys. Review and merge the clips
#     through a normal pull request.
#   * Spread Out!: the clips are committed to the branch the run was started
#     from, so they ride along in that branch's pull request. It refuses to
#     run on main.
#
# Safe to run again: clips already in the repository are skipped, so only new
# or edited sentences are recorded.
on:
  workflow_dispatch:
    inputs:
      game:
        description: Which game to record
        type: choice
        options: [football-iq]   # Spread Out! has its own voice now: spread-out-voice.yml
        default: football-iq

permissions:
  contents: read

concurrency:
  group: voice-clips-${{ inputs.game }}
  cancel-in-progress: false

env:
  UNITS: ${{ inputs.game == 'spread-out' && 'spread-out/voice/units.json' || 'football-iq/voice/units.json' }}
  CLIPS: ${{ inputs.game == 'spread-out' && 'spread-out/voice' || 'football-iq/public/voice' }}
  SHARDS: ${{ inputs.game == 'spread-out' && 2 || 6 }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.game == 'spread-out' && '[0, 1]' || '[0, 1, 2, 3, 4, 5]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg

      - name: Install Kokoro (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile numpy

      - name: Record this slice
        run: |
          python football-iq/voice/render_clips.py \
            --units "$UNITS" \
            --out new-clips \
            --skip-dir "$CLIPS" \
            --shard ${{ matrix.shard }}/$SHARDS

      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.shard }}
          path: new-clips
          if-no-files-found: ignore

  publish:
    needs: record
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the voice-clips branch, or the branch this run started from
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          merge-multiple: true
          path: ${{ env.CLIPS }}

      - name: Write the clip list
        run: python3 football-iq/voice/render_clips.py --units "$UNITS" --out "$CLIPS" --manifest-only

      - name: Push the voice-clips branch (Football IQ)
        if: ${{ inputs.game != 'spread-out' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B voice-clips
          git add football-iq/public/voice
          git commit -m "Record coach voice clips (am_eric)"
          git push --force origin HEAD:refs/heads/voice-clips
          {
            echo "### Voice clips"
            echo
            echo "The clips are on the **voice-clips** branch. Open a pull request from it into main to review and merge them."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the clips to this branch (Spread Out!)
        if: ${{ inputs.game == 'spread-out' }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Refusing to commit clips straight to main. Run this on the branch that holds the new lines." >&2
            exit 1
          fi
          rm -f spread-out/voice/failed-shard-*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spread-out/voice
          if git diff --cached --quiet; then
            echo "No new clips to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Record Coach Eric voice clips for Spread Out! (am_eric)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          {
            echo "### Spread Out voice clips"
            echo
            echo "New clips were committed to the **${{ github.ref_name }}** branch. Open or update a pull request from it into main to publish them."
          } >> "$GITHUB_STEP_SUMMARY"
