name: Voice clips

# Records every fixed sentence in Football IQ with the coach voice (Kokoro,
# "am_eric") and puts the clips on a branch called voice-clips.
#
# Run it by hand: Actions tab, "Voice clips", "Run workflow".
# It only ever writes to the voice-clips branch. It never touches main and
# never deploys. Review and merge the clips through a normal pull request.
#
# Safe to run again: clips already in the repository are skipped, so only new
# or edited sentences are recorded.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-clips
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg

      - name: Install Kokoro (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile numpy

      - name: Record this slice
        run: |
          python football-iq/voice/render_clips.py \
            --out new-clips \
            --skip-dir football-iq/public/voice \
            --shard ${{ matrix.shard }}/6

      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.shard }}
          path: new-clips
          if-no-files-found: ignore

  publish:
    needs: record
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the voice-clips branch only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          merge-multiple: true
          path: football-iq/public/voice

      - name: Write the clip list
        run: python3 football-iq/voice/render_clips.py --out football-iq/public/voice --manifest-only

      - name: Push the voice-clips branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B voice-clips
          git add football-iq/public/voice
          git commit -m "Record coach voice clips (am_eric)"
          git push --force origin HEAD:refs/heads/voice-clips
          {
            echo "### Voice clips"
            echo
            echo "The clips are on the **voice-clips** branch. Open a pull request from it into main to review and merge them."
          } >> "$GITHUB_STEP_SUMMARY"
