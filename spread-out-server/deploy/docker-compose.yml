# Spread Out! server for Hostinger's VPS Docker Manager (VPS image "Ubuntu 24.04 with Docker").
# No image build is needed (the Docker Manager cannot build from GitHub):
#   app    the stock node:22 image; on every start it downloads or updates the
#          spread-out folders of BRANCH from GitHub into the "code" volume and
#          runs deploy/docker-start.sh, which installs and starts the server.
#   caddy  the HTTPS front door on ports 80/443: automatic certificates for
#          DOMAIN, forwarding to app inside the Docker network.
# Settings (the project's environment, KEY=value per line):
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET   required
#   STRIPE_PRICE_ID, DOMAIN, BRANCH            optional
# The purchase database and the signing secret live in the "purchases" volume.
# Update to the latest code: restart the project.
services:
  app:
    image: node:22-bookworm
    restart: unless-stopped
    working_dir: /srv
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /data/purchases.sqlite
      PUBLIC_URL: https://${DOMAIN:-play.artcornerstudio.cloud}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-price_1UORF3JMJd2TdRXlcf6CpEbm}
    volumes:
      - purchases:/data
      - code:/srv
    command:
      - sh
      - -c
      - >-
        (git -C app fetch -q --depth 1 origin ${BRANCH:-main} && git -C app reset -q --hard FETCH_HEAD
        || git clone -q --depth 1 --branch ${BRANCH:-main} --filter=blob:none --sparse https://github.com/artcornerstudio/art-corner-games.git app)
        && git -C app sparse-checkout set spread-out spread-out-server
        && exec sh app/spread-out-server/deploy/docker-start.sh

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    command: caddy reverse-proxy --from ${DOMAIN:-play.artcornerstudio.cloud} --to app:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  purchases:
  code:
  caddy_data:
  caddy_config:
