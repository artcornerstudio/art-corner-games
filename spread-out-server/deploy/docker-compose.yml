# Spread Out! server for Hostinger's VPS Docker Manager (VPS image "Ubuntu 24.04 with Docker").
#
#   app    built straight from GitHub (spread-out-server/Dockerfile at BRANCH),
#          runs the game server inside the Docker network on port 3000.
#   caddy  the HTTPS front door on ports 80/443: gets and renews the
#          certificate for DOMAIN automatically and forwards to app.
#
# Settings (the project's environment, KEY=value per line):
#   STRIPE_SECRET_KEY      required  sk_/rk_ test or live key
#   STRIPE_WEBHOOK_SECRET  required  whsec_ of the endpoint https://DOMAIN/api/stripe/webhook
#   STRIPE_PRICE_ID        optional  defaults to the $4.99 test-mode price
#   DOMAIN                 optional  defaults to play.artcornerstudio.cloud
#   BRANCH                 optional  defaults to main
# The purchase database and the signing secret live in the "purchases" volume.
# Update to the latest code: update the project (it rebuilds from GitHub).
services:
  app:
    build:
      context: https://github.com/artcornerstudio/art-corner-games.git#${BRANCH:-main}
      dockerfile: spread-out-server/Dockerfile
    image: spread-out-server:local
    pull_policy: build
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:-play.artcornerstudio.cloud}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-price_1UORF3JMJd2TdRXlcf6CpEbm}
    volumes:
      - purchases:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    command: caddy reverse-proxy --from ${DOMAIN:-play.artcornerstudio.cloud} --to app:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  purchases:
  caddy_data:
  caddy_config:
